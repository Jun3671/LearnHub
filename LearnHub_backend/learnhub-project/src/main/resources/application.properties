spring.application.name=learnhub-project

# Active Profile (dev for local, prod for production)
spring.profiles.active=dev

# Database Configuration (프로파일별로 오버라이드)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learnhub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:learnhub-secret-key-for-jwt-authentication-please-change-in-production}
jwt.expiration=86400000

# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:}

# CORS (쉼표로 구분된 허용 도메인, 기본값 *)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
